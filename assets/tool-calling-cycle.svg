<svg width="700" height="260" viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Tool calling request cycle</title>
<desc>Shows the LLM requesting a tool call with structured parameters, which passes through the system's validation and authorization layer before actual execution occurs, illustrating that the LLM only ever requests a tool call while the system is the real security boundary and execution environment, with the result returned to the LLM as an observation.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5"/></marker></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#E6E6E6;}
.lbl{font-size:11.5px;font-weight:600;fill:#F5F5F5;}
.sub{font-size:9.5px;fill:#C9C9C9;}
.llm{fill:#241E3D;stroke:#8C7DE0;stroke-width:1;}
.guard{fill:#3A1E1E;stroke:#D97070;stroke-width:1;}
.exec{fill:#173829;stroke:#4CAF8C;stroke-width:1;}
line{stroke:#9CA3AF;stroke-width:1.3;marker-end:url(#a);}
</style>
<rect x="0" y="0" width="700" height="260" fill="#0D1117"/>

<rect class="llm" x="20" y="90" width="140" height="60" rx="8"/>
<text class="lbl" x="90" y="112" text-anchor="middle" font-size="11">LLM</text>
<text class="sub" x="90" y="130" text-anchor="middle">requests: call_tool(</text>
<text class="sub" x="90" y="142" text-anchor="middle">params)</text>

<line x1="160" y1="120" x2="220" y2="120"/>

<rect class="guard" x="220" y="90" width="180" height="60" rx="8"/>
<text class="lbl" x="310" y="112" text-anchor="middle" font-size="11">Your system</text>
<text class="sub" x="310" y="130" text-anchor="middle">validate + authorize</text>
<text class="sub" x="310" y="142" text-anchor="middle">(treat as untrusted input)</text>

<line x1="400" y1="120" x2="460" y2="120"/>

<rect class="exec" x="460" y="90" width="140" height="60" rx="8"/>
<text class="lbl" x="530" y="112" text-anchor="middle" font-size="11">Actual execution</text>
<text class="sub" x="530" y="130" text-anchor="middle">DB, API, filesystem</text>

<line x1="530" y1="150" x2="530" y2="190"/>
<line x1="530" y1="190" x2="90" y2="190"/>
<line x1="90" y1="190" x2="90" y2="150"/>
<text class="sub" x="310" y="205" text-anchor="middle">result returned as an observation, continuing the loop</text>

<text class="sub" x="310" y="230" text-anchor="middle">The LLM never directly touches your database, API, or filesystem — your system is the real security boundary.</text>
</svg>
