<svg width="740" height="240" viewBox="0 0 740 240" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Where the AI component sits in a broader product architecture</title>
<desc>Shows a request flow from client through API gateway into conventional business logic handling auth and validation, which calls an AI component such as an inference call or RAG pipeline, then continues to conventional data stores, illustrating that the AI component is one specialized service within a mostly conventional system rather than the entire architecture.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5"/></marker></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#E6E6E6;}
.lbl{font-size:11.5px;font-weight:600;fill:#F5F5F5;}
.sub{font-size:9px;fill:#C9C9C9;}
.conv{fill:#241E3D;stroke:#8C7DE0;stroke-width:1;}
.ai{fill:#3A2A10;stroke:#E0A33D;stroke-width:1;}
line{stroke:#9CA3AF;stroke-width:1.3;marker-end:url(#a);}
</style>
<rect x="0" y="0" width="740" height="240" fill="#0D1117"/>
<text class="lbl" x="370" y="26" text-anchor="middle" font-size="13">The AI component is one piece, not the whole system</text>

<rect class="conv" x="15" y="90" width="100" height="50" rx="8"/>
<text class="lbl" x="65" y="112" text-anchor="middle" font-size="10.5">Client</text>
<line x1="115" y1="115" x2="165" y2="115"/>

<rect class="conv" x="165" y="90" width="110" height="50" rx="8"/>
<text class="lbl" x="220" y="112" text-anchor="middle" font-size="10.5">API Gateway</text>
<line x1="275" y1="115" x2="325" y2="115"/>

<rect class="conv" x="325" y="90" width="140" height="50" rx="8"/>
<text class="lbl" x="395" y="108" text-anchor="middle" font-size="10">Business Logic</text>
<text class="sub" x="395" y="124" text-anchor="middle">auth, validation</text>
<line x1="465" y1="115" x2="515" y2="115"/>

<rect class="ai" x="515" y="90" width="120" height="50" rx="8"/>
<text class="lbl" x="575" y="108" text-anchor="middle" font-size="10">AI Component</text>
<text class="sub" x="575" y="124" text-anchor="middle">inference / RAG / agent</text>

<line x1="395" y1="140" x2="395" y2="185"/>
<rect class="conv" x="300" y="185" width="190" height="42" rx="8"/>
<text class="lbl" x="395" y="207" text-anchor="middle" font-size="10">Conventional data stores</text>

<text class="sub" x="575" y="170" text-anchor="middle">Treat this like any slow,</text>
<text class="sub" x="575" y="184" text-anchor="middle">sometimes-unreliable dependency:</text>
<text class="sub" x="575" y="198" text-anchor="middle">timeouts, retries, circuit breakers,</text>
<text class="sub" x="575" y="212" text-anchor="middle">graceful degradation.</text>
</svg>
