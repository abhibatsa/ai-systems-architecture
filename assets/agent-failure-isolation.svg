<svg width="700" height="260" viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Failure isolation between agents</title>
<desc>Shows Agent A failing repeatedly, with a circuit breaker and per-agent timeout wrapping it to stop it from consuming the shared budget or blocking progress, and a validation checkpoint between Agent A and Agent B preventing a bad or hallucinated result from propagating downstream, keeping the failure contained rather than cascading through the rest of the pipeline.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5"/></marker></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#E6E6E6;}
.lbl{font-size:11.5px;font-weight:600;fill:#F5F5F5;}
.sub{font-size:9.5px;fill:#C9C9C9;}
.fail{fill:#3A1E1E;stroke:#D97070;stroke-width:1;}
.guard{fill:#3A2A10;stroke:#E0A33D;stroke-width:1;}
.ok{fill:#173829;stroke:#4CAF8C;stroke-width:1;}
line{stroke:#9CA3AF;stroke-width:1.3;marker-end:url(#a);}
</style>
<rect x="0" y="0" width="700" height="260" fill="#0D1117"/>

<rect class="fail" x="30" y="70" width="120" height="50" rx="8"/>
<text class="lbl" x="90" y="90" text-anchor="middle" font-size="10.5">Agent A</text>
<text class="sub" x="90" y="108" text-anchor="middle">failing / looping</text>

<rect class="guard" x="180" y="60" width="150" height="70" rx="8"/>
<text class="lbl" x="255" y="82" text-anchor="middle" font-size="10">Circuit breaker +</text>
<text class="lbl" x="255" y="98" text-anchor="middle" font-size="10">timeout / iteration cap</text>
<text class="sub" x="255" y="115" text-anchor="middle">fails fast, contains blast radius</text>
<line x1="150" y1="95" x2="180" y2="95"/>

<line x1="330" y1="95" x2="380" y2="95"/>
<rect class="guard" x="380" y="70" width="130" height="50" rx="8"/>
<text class="lbl" x="445" y="90" text-anchor="middle" font-size="10">Validation</text>
<text class="sub" x="445" y="108" text-anchor="middle">checkpoint</text>

<line x1="510" y1="95" x2="560" y2="95"/>
<rect class="ok" x="560" y="70" width="110" height="50" rx="8"/>
<text class="lbl" x="615" y="90" text-anchor="middle" font-size="10.5">Agent B</text>
<text class="sub" x="615" y="108" text-anchor="middle">unaffected</text>

<text class="sub" x="350" y="180" text-anchor="middle">A production multi-agent system assumes any agent can misbehave at any time —</text>
<text class="sub" x="350" y="196" text-anchor="middle">the design goal is containing that failure, not preventing it from ever happening.</text>
</svg>
