<svg width="700" height="360" viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Build vs buy decision guide for AI components</title>
<desc>Shows a decision tree starting with the question "is this component your genuine differentiator", branching to build/customize if yes, and to a second question about data sensitivity if no, which branches to self-host if compliance requires it or buy a hosted API if it is commodity infrastructure with no special data constraints.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5"/></marker></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#E6E6E6;}
.lbl{font-size:12px;font-weight:600;fill:#F5F5F5;}
.sub{font-size:9.5px;fill:#C9C9C9;}
.q{fill:#3A2A10;stroke:#E0A33D;stroke-width:1;}
.build{fill:#241E3D;stroke:#8C7DE0;stroke-width:1;}
.buy{fill:#173829;stroke:#4CAF8C;stroke-width:1;}
.selfhost{fill:#3A1E1E;stroke:#D97070;stroke-width:1;}
line{stroke:#9CA3AF;stroke-width:1.3;marker-end:url(#a);}
</style>
<rect x="0" y="0" width="700" height="360" fill="#0D1117"/>

<rect class="q" x="220" y="20" width="260" height="56" rx="8"/>
<text class="lbl" x="350" y="42" text-anchor="middle" font-size="11">Is this component your</text>
<text class="lbl" x="350" y="58" text-anchor="middle" font-size="11">genuine differentiator?</text>

<line x1="280" y1="76" x2="180" y2="130"/>
<text class="sub" x="220" y="105" text-anchor="middle">Yes</text>
<rect class="build" x="60" y="130" width="240" height="56" rx="8"/>
<text class="lbl" x="180" y="152" text-anchor="middle" font-size="11">Build / fine-tune</text>
<text class="sub" x="180" y="170" text-anchor="middle">this is the product's actual edge</text>

<line x1="420" y1="76" x2="500" y2="130"/>
<text class="sub" x="470" y="105" text-anchor="middle">No</text>
<rect class="q" x="380" y="130" width="240" height="56" rx="8"/>
<text class="lbl" x="500" y="152" text-anchor="middle" font-size="11">Data sensitivity or</text>
<text class="lbl" x="500" y="168" text-anchor="middle" font-size="11">compliance requirement?</text>

<line x1="440" y1="186" x2="360" y2="240"/>
<text class="sub" x="410" y="215" text-anchor="middle">Yes</text>
<rect class="selfhost" x="240" y="240" width="240" height="56" rx="8"/>
<text class="lbl" x="360" y="262" text-anchor="middle" font-size="11">Self-host</text>
<text class="sub" x="360" y="280" text-anchor="middle">compliance overrides cost/speed calc</text>

<line x1="560" y1="186" x2="620" y2="240"/>
<text class="sub" x="600" y="215" text-anchor="middle">No</text>
<rect class="buy" x="520" y="240" width="160" height="56" rx="8"/>
<text class="lbl" x="600" y="262" text-anchor="middle" font-size="11">Buy — hosted API</text>
<text class="sub" x="600" y="280" text-anchor="middle">commodity infra</text>

<text class="sub" x="350" y="335" text-anchor="middle">Revisit as volume grows — the right answer at 1K req/day and 10M req/day is often genuinely different.</text>
</svg>
