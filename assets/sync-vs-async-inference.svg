<svg width="740" height="300" viewBox="0 0 740 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Sync vs async inference request patterns</title>
<desc>Shows three inference request patterns: synchronous where the client blocks and waits for the full AI response, asynchronous where the client submits a job and polls or receives a callback later, and streaming where tokens return progressively as they are generated, giving immediate visible progress without full async job complexity.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5"/></marker></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#E6E6E6;}
.lbl{font-size:12px;font-weight:700;fill:#F5F5F5;}
.sub{font-size:9.5px;fill:#C9C9C9;}
.box{fill:#241E3D;stroke:#8C7DE0;stroke-width:1;}
.ai{fill:#3A2A10;stroke:#E0A33D;stroke-width:1;}
line{stroke:#9CA3AF;stroke-width:1.3;marker-end:url(#a);}
</style>
<rect x="0" y="0" width="740" height="300" fill="#0D1117"/>

<text class="lbl" x="120" y="26" font-size="12">Synchronous</text>
<rect class="box" x="20" y="40" width="90" height="40" rx="6"/>
<text class="sub" x="65" y="63" text-anchor="middle">Client</text>
<line x1="110" y1="60" x2="160" y2="60"/>
<rect class="ai" x="160" y="40" width="120" height="40" rx="6"/>
<text class="sub" x="220" y="63" text-anchor="middle">AI call — blocks</text>
<line x1="280" y1="70" x2="120" y2="70" stroke-dasharray="3,2"/>
<text class="sub" x="200" y="90">waits for full response, single round trip</text>

<text class="lbl" x="120" y="130" font-size="12">Asynchronous</text>
<rect class="box" x="20" y="145" width="90" height="40" rx="6"/>
<text class="sub" x="65" y="168" text-anchor="middle">Client</text>
<line x1="110" y1="160" x2="160" y2="160"/>
<rect class="ai" x="160" y="145" width="130" height="40" rx="6"/>
<text class="sub" x="225" y="168" text-anchor="middle">submit → job ID</text>
<line x1="290" y1="175" x2="130" y2="175" stroke-dasharray="3,2"/>
<text class="sub" x="210" y="192">later: poll or callback/webhook delivers result</text>

<text class="lbl" x="480" y="26" font-size="12">Streaming</text>
<rect class="box" x="380" y="40" width="90" height="40" rx="6"/>
<text class="sub" x="425" y="63" text-anchor="middle">Client</text>
<line x1="470" y1="52" x2="520" y2="52"/>
<line x1="470" y1="62" x2="520" y2="62"/>
<line x1="470" y1="72" x2="520" y2="72"/>
<rect class="ai" x="520" y="40" width="130" height="40" rx="6"/>
<text class="sub" x="585" y="63" text-anchor="middle">tokens, progressively</text>
<text class="sub" x="500" y="100">immediate visible progress, no full async complexity</text>

<text class="sub" x="370" y="250" text-anchor="middle">Streaming is the actual pattern behind most modern chat UIs — naming it explicitly</text>
<text class="sub" x="370" y="266" text-anchor="middle">for an interactive/conversational scenario is a real interview signal.</text>
</svg>
