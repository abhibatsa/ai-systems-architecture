<svg width="700" height="280" viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Short-term vs long-term agent memory</title>
<desc>Shows short-term memory living directly in the model's bounded context window within a single session, versus long-term memory persisted in an external store such as a vector database or structured database, retrieved and injected into context as relevant across sessions, similar in shape to RAG retrieval but querying the agent's own history rather than a document corpus.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5"/></marker></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#E6E6E6;}
.lbl{font-size:12px;font-weight:600;fill:#F5F5F5;}
.sub{font-size:9.5px;fill:#C9C9C9;}
.short{fill:#241E3D;stroke:#8C7DE0;stroke-width:1;}
.long{fill:#3A2A10;stroke:#E0A33D;stroke-width:1;}
line{stroke:#9CA3AF;stroke-width:1.3;marker-end:url(#a);}
</style>
<rect x="0" y="0" width="700" height="280" fill="#0D1117"/>

<rect class="short" x="30" y="40" width="280" height="140" rx="10"/>
<text class="lbl" x="170" y="65" text-anchor="middle">Short-term memory</text>
<text class="sub" x="170" y="88" text-anchor="middle">lives in the context window,</text>
<text class="sub" x="170" y="102" text-anchor="middle">bounded by its size</text>
<text class="sub" x="170" y="126" text-anchor="middle">Design question: what to do</text>
<text class="sub" x="170" y="140" text-anchor="middle">when history gets long —</text>
<text class="sub" x="170" y="154" text-anchor="middle">summarize, drop, or hard-limit?</text>

<rect class="long" x="390" y="40" width="280" height="140" rx="10"/>
<text class="lbl" x="530" y="65" text-anchor="middle">Long-term memory</text>
<text class="sub" x="530" y="88" text-anchor="middle">external store, persisted</text>
<text class="sub" x="530" y="102" text-anchor="middle">across sessions</text>
<text class="sub" x="530" y="126" text-anchor="middle">Retrieved and injected —</text>
<text class="sub" x="530" y="140" text-anchor="middle">same shape as RAG, but querying</text>
<text class="sub" x="530" y="154" text-anchor="middle">the agent's own history, not a corpus</text>

<text class="sub" x="350" y="220" text-anchor="middle">A real system needs an answer for "the user corrected the agent later" —</text>
<text class="sub" x="350" y="236" text-anchor="middle">memory that can't be corrected or forgotten is a real product problem, not an edge case.</text>
</svg>
