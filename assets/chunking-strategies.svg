<svg width="740" height="280" viewBox="0 0 740 280" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Chunking strategies compared</title>
<desc>Shows a source document split three ways: fixed-size chunking with arbitrary boundaries that can split a sentence in half, semantic chunking that splits at natural paragraph boundaries preserving complete ideas, and recursive chunking that tries large boundaries first and only recurses into smaller ones when a section is too large.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#E6E6E6;}
.lbl{font-size:12px;font-weight:600;fill:#F5F5F5;}
.sub{font-size:9.5px;fill:#C9C9C9;}
.chunk{stroke-width:1;}
.c1{fill:#3A1E1E;stroke:#D97070;}
.c2{fill:#173829;stroke:#4CAF8C;}
.c3{fill:#241E3D;stroke:#8C7DE0;}
</style>
<rect x="0" y="0" width="740" height="280" fill="#0D1117"/>

<text class="lbl" x="30" y="26">Fixed-size (splits mid-sentence)</text>
<rect class="chunk c1" x="20" y="35" width="220" height="40" rx="4"/>
<text class="sub" x="130" y="59" text-anchor="middle">"...the system handles retries by wait-</text>
<rect class="chunk c1" x="245" y="35" width="220" height="40" rx="4"/>
<text class="sub" x="355" y="59" text-anchor="middle">ing with exponential backoff..."</text>
<text class="sub" x="130" y="88">← idea split arbitrarily across the boundary</text>

<text class="lbl" x="30" y="130">Semantic (splits at paragraph boundaries)</text>
<rect class="chunk c2" x="20" y="140" width="320" height="40" rx="4"/>
<text class="sub" x="180" y="164" text-anchor="middle">"...retries with exponential backoff." (complete idea)</text>
<rect class="chunk c2" x="345" y="140" width="320" height="40" rx="4"/>
<text class="sub" x="505" y="164" text-anchor="middle">"Circuit breakers trip after 5 failures." (complete idea)</text>

<text class="lbl" x="30" y="210">Recursive (large boundary first, split further only if needed)</text>
<rect class="chunk c3" x="20" y="220" width="700" height="40" rx="4"/>
<text class="sub" x="370" y="238" text-anchor="middle">Whole section, if it fits within the size limit —</text>
<text class="sub" x="370" y="252" text-anchor="middle">otherwise recurse into paragraphs, then sentences</text>
</svg>
