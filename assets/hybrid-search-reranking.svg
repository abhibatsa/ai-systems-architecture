<svg width="740" height="260" viewBox="0 0 740 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Hybrid search and reranking flow</title>
<desc>Shows a query going to both a vector similarity search and a keyword search in parallel, with results from both combined into a larger candidate set, which is then narrowed by a more expensive reranking model into a final small set of highly relevant results, illustrating cheap broad retrieval followed by expensive precise refinement.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5"/></marker></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#E6E6E6;}
.lbl{font-size:11px;font-weight:600;fill:#F5F5F5;}
.sub{font-size:9.5px;fill:#C9C9C9;}
.box{stroke-width:1;}
.q{fill:#241E3D;stroke:#8C7DE0;}
.search{fill:#173829;stroke:#4CAF8C;}
.rerank{fill:#3A2A10;stroke:#E0A33D;}
line{stroke:#9CA3AF;stroke-width:1.3;marker-end:url(#a);}
</style>
<rect x="0" y="0" width="740" height="260" fill="#0D1117"/>

<rect class="box q" x="20" y="90" width="100" height="42" rx="6"/>
<text class="sub" x="70" y="113" text-anchor="middle">Query</text>

<line x1="120" y1="100" x2="180" y2="55"/>
<rect class="box search" x="180" y="30" width="150" height="42" rx="6"/>
<text class="sub" x="255" y="53" text-anchor="middle">Vector similarity search</text>

<line x1="120" y1="122" x2="180" y2="150"/>
<rect class="box search" x="180" y="128" width="150" height="42" rx="6"/>
<text class="sub" x="255" y="151" text-anchor="middle">Keyword search (BM25)</text>

<line x1="330" y1="51" x2="400" y2="90"/>
<line x1="330" y1="149" x2="400" y2="110"/>
<rect class="box q" x="400" y="80" width="140" height="42" rx="6"/>
<text class="sub" x="470" y="98" text-anchor="middle">Combined candidates</text>
<text class="sub" x="470" y="112" text-anchor="middle">(larger set, cheap)</text>

<line x1="540" y1="101" x2="590" y2="101"/>
<rect class="box rerank" x="590" y="80" width="130" height="42" rx="6"/>
<text class="sub" x="655" y="98" text-anchor="middle">Rerank</text>
<text class="sub" x="655" y="112" text-anchor="middle">(smaller set, expensive)</text>

<text class="sub" x="370" y="200" text-anchor="middle">Same shape as a DB index scan narrowing candidates before an expensive full comparison —</text>
<text class="sub" x="370" y="216" text-anchor="middle">cheap broad retrieval, expensive precise refinement, applied to search instead of databases.</text>
</svg>
